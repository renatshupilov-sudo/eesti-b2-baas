name: Validate content
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema==4.23.0
      - name: Build lessons and check against schema
        run: |
          python3 tools/build.py . | tee build.log
          grep -q "errors 0" build.log
      - name: Built files must match the committed ones
        run: git diff --exit-code -- content
