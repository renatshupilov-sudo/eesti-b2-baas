name: Generate audio
# Озвучка создаётся ещё в pull request, чтобы после слияния на сайте сразу были все файлы.
on:
  pull_request:
    paths: ["content/lessons/**", "tools/audio_plan.py", "tools/make_audio.py", ".github/workflows/audio.yml"]
  push:
    branches: [main]
    paths: ["content/lessons/**", "tools/audio_plan.py", "tools/make_audio.py", ".github/workflows/audio.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: audio-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  audio:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Generate missing audio with TartuNLP Neurokõne
        run: python3 tools/make_audio.py .
      - name: Commit audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content/audio
          git diff --cached --quiet || (git commit -m "Generate lesson audio" && git push)
