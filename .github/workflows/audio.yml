name: Generate audio
on:
  push:
    branches: [main]
    paths: ["content/lessons/**", "tools/audio_plan.py", "tools/make_audio.py", ".github/workflows/audio.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: audio
  cancel-in-progress: false
jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Generate missing audio with TartuNLP Neurokõne
        run: python3 tools/make_audio.py .
      - name: Commit audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content/audio
          git diff --cached --quiet || (git commit -m "Generate lesson audio" && git push)
